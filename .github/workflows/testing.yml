name: Testing
run-name: Test commit "${{ github.event.head_commit.message }}"
on:
  push:
    branches-ignore:
      - 'main'

jobs:
  plan:
    name: Check witch apps need testing
    runs-on: ubuntu-latest
    outputs:
      web-has-changes: ${{ steps.check.outputs.web_has_changes }}
      api-has-changes: ${{ steps.check.outputs.api_has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install jq dependency
        run: |
            sudo apt-get update
            sudo apt-get install -y jq

      - name: Install node dependencies
        run: npm ci

      - name: Check if web or api changed
        id: check
        run: |
          WEB_COUNT=$(npx turbo query affected --packages web | jq '.data.affectedPackages.length')
          API_COUNT=$(npx turbo query affected --packages api | jq '.data.affectedPackages.length')

          if [ "$WEB_COUNT" -gt 0 ]; then
            echo "web_has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "web_has_changes=false" >> $GITHUB_OUTPUT
          fi

          if [ "$API_COUNT" -gt 0 ]; then
            echo "api_has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "api_has_changes=false" >> $GITHUB_OUTPUT
          fi

  web-tests:
    name: Run web app ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.web-has-changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.suite }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.suite }}-
            ${{ runner.os }}-turbo-

      - run: npm ci

      - name: Build (e2e needs it)
        if: matrix.suite == 'e2e'
        run: npm run build -- --filter=web

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }} -- --filter=web

      - name: Upload Cypress artifacts
        if: failure() && matrix.suite == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            apps/web/cypress/videos/**
            apps/web/cypress/screenshots/**
          if-no-files-found: ignore

  api-tests:
    name: Run api tests
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.api-has-changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.suite }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.suite }}-
            ${{ runner.os }}-turbo-

      - run: npm ci

      - name: Build (just to be on the safe side)
        if: matrix.suite == 'e2e'
        run: npm run build -- --filter=api

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }} -- --filter=api

  comment-on-commit-for-web:
    name: Comment on failed commit
    runs-on: ubuntu-latest
    needs: [ 'web-tests' ]
    if: failure()
    steps:
      - name: Create comment
        run: |
          gh api -X "POST" \
          /repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
          -f body='❌ Tests failed on the web app. Please check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  comment-on-commit-for-api:
    name: Comment on failed commit
    runs-on: ubuntu-latest
    needs: [ 'api-tests' ]
    if: failure()
    steps:
      - name: Create comment
        run: |
          gh api -X "POST" \
          /repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
          -f body='❌ Tests failed on the api app. Please check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
