name: Testing
run-name: Test commit of ${{ github.ref_name }}
on:
  push:
    branches-ignore:
      - 'main'
jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache turbo build setup
        uses: actions/cache/restore@v6
        with:
          path: |
             node_modules
             .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  create-issue:
    runs-on: ubuntu-latest
    needs: [ 'run-test' ]
    if: needs.run-test.result != 'success'
    permissions:
      issues: write
    steps:
      - name: Create issue
        run: gh issue create -a @${{ github.actor }} --type "Tests failed" -l ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  remove-issues:
    runs-on: ubuntu-latest
    needs: [ 'run-test' ]
    if: needs.run-test.result == 'success'
    permissions:
      issues: write
    steps:
      - name: Get past issues
        run: echo "$(gh issue list --type "Tests failed" -l ${{ github.ref_name }} --json number)" >> issues.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install JQ
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Remove issues
        run: |
          jq -c '.[] | .number' issues.json | while read i; do
            gh issue delete $i
          done
